services:
  - type: web
    name: sandia-pharmacie
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: AUTH_ALLOW_DEV_CODE
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_AUTH_MAX
        value: "30"
      - key: RATE_LIMIT_OTP_MAX
        value: "20"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: pharmacie_mali
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Administrateur
      - key: ADMIN_EMAIL
        sync: false
      # Brevo HTTPS (Render free bloque SMTP 25/465/587)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: SMTP_FROM
        sync: false
      # Alertes péremption / stock par e-mail
      - key: ALERTES_EMAIL_ENABLED
        value: "true"
      - key: ALERTES_INTERVAL_HEURES
        value: "6"
      - key: CRON_SECRET
        generateValue: true
      # SMTP optionnel (local / instance payante uniquement)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
